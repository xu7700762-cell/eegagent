<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EEGAgent · API 配置</title><link rel="stylesheet" href="/assets/design-tokens.css"><link rel="stylesheet" href="/assets/brain.css"></head>
<body><main class="content-page" style="max-width:760px;margin:48px auto;padding:24px"><a href="/">← 返回三个 Agent 协作对话</a><h1>GPT 接口配置</h1><p>VRMSAgent 使用真实 GPT 工具调用；配置只保存在本项目，密钥不回填到网页。</p><form id="cloudForm" class="knowledge-import-card"><label>Base URL<input id="base" type="url" required placeholder="http://127.0.0.1:8317/v1"></label><label>Model ID<input id="model" value="gpt-6.1-sol" required></label><label>API Key<input id="key" type="password" autocomplete="new-password" placeholder="留空保留已保存密钥"></label><button type="submit" class="primary-button">保存配置</button><button type="button" id="test">测试已保存接口</button><p id="status" role="status"></p></form></main><script>
const $=id=>document.getElementById(id);
async function request(url,options){const response=await fetch(url,options);const value=await response.json();if(!response.ok)throw new Error(value.detail||'请求失败');return value;}
async function refresh(){const value=await request('/api/cloud-settings');$('base').value=value.base_url||'http://127.0.0.1:8317/v1';$('model').value=value.model_id||'gpt-6.1-sol';$('status').textContent=value.configured?'密钥已保存（隐藏）':'尚未配置接口';$('cloudForm').querySelectorAll('input,button').forEach(node=>node.disabled=value.in_use);}
$('cloudForm').onsubmit=async event=>{event.preventDefault();try{await request('/api/cloud-settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile_id:'cpa_gpt',base_url:$('base').value,model_id:$('model').value,api_key:$('key').value})});$('key').value='';await refresh();}catch(error){$('status').textContent=error.message;}};
$('test').onclick=async()=>{try{$('test').disabled=true;const value=await request('/api/cloud-settings/test',{method:'POST'});$('status').textContent=JSON.stringify(value);}catch(error){$('status').textContent=error.message;}finally{$('test').disabled=false;}};
refresh().catch(error=>$('status').textContent=error.message);
</script></body></html>
