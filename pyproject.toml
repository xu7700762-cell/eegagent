[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegagent"
version = "0.0.0"
description = "Current raw EEG webpage with three specialists, Supervisor and genuine GPT tool decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scipy>=1.11,<2", "PyYAML>=6", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "openai>=1.109,<3", "pydantic>=2.11,<3", "scikit-learn>=1.3,<2", "joblib>=1.3", "mne>=1.6,<2"]

[project.optional-dependencies]
model = ["torch>=2.2", "mamba-ssm>=2.2"]
test = ["pytest>=7", "httpx>=0.27", "torch>=2.2"]

[project.scripts]
eeg-agent = "eeg_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["eeg_agent*", "vrms_model*", "scripts*", "results*"]

[tool.setuptools.package-data]
eeg_agent = ["web/*", "brain_knowledge/*/*.md"]
results = ["*.json", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
